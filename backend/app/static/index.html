        syncAgentProposalWorkflow(proposal, payload, controls);
      } catch {
        controls.statusElement.textContent = "无法连接 FileNest API，请稍后重试。";
      } finally {
        controls.busy = false;
        if (controls.lastWorkflow) {
          configureAgentProposalActions(controls.lastWorkflow, controls);
        } else if (proposal.approval_status === "WAITING_APPROVAL") {
          for (const button of controls.buttons) {
            button.disabled = false;
          }
        }
      }
    }

    async function executeAgentProposal(proposal, controls) {
      controls.busy = true;
      for (const button of controls.buttons) {
        button.disabled = true;
      }
      controls.statusElement.textContent = "正在读取最新提案状态…";
      try {
        const workflow = await fetchAgentProposalWorkflow(proposal);
        syncAgentProposalWorkflow(proposal, workflow, controls);
        const snapshot = workflowSnapshot(workflow);
        if (snapshot === null) {
          throw new Error("execution snapshot unavailable");
        }
        if (
          workflow.approval_status !== "APPROVED" ||
          workflow.status !== "ready" ||
          workflow.operation?.overall_status !== "APPROVED"
        ) {
          controls.statusElement.textContent =
            "当前提案不可执行，未执行文件操作。";
          return;
        }

        controls.statusElement.textContent = "正在执行文件操作…";
        const query = new URLSearchParams({
          expected_plan_id: snapshot.planId,
          expected_revision: String(snapshot.revision),
        });
        const response = await fetch(
          `/api/v1/workflows/${encodeURIComponent(proposal.workflow_id)}/execute?${query}`,
          {method: "POST"},
        );
        const payload = await response.json();
        if (!response.ok) {
          if (response.status === 409) {
            await refreshAgentProposalAfterConflict(
              proposal,
              controls,
              "计划状态已变化，已重新读取；未自动重试。",
            );
            return;
          }
          controls.statusElement.textContent = safeErrorMessage(
            payload,
            "执行失败，请刷新提案后重试。",
          );
          return;
        }
        renderAgentExecutionItems(payload, controls, "执行");

        try {
          const refreshedWorkflow = await fetchAgentProposalWorkflow(proposal);
          syncAgentProposalWorkflow(proposal, refreshedWorkflow, controls);
          if (payload.status === "COMPLETED") {
            controls.statusElement.textContent = "计划已执行，文件已移动，可以撤销。";
          }
        } catch {
          hideAgentProposalActions(controls);
          controls.lastWorkflow = null;
          controls.statusElement.textContent =
            "执行响应已返回，但最新提案状态暂不可用；请刷新后确认，期间不会重复执行。";
        }
      } catch {
        controls.statusElement.textContent = "执行请求失败，请刷新提案后重试。";
      } finally {
        controls.busy = false;
        if (controls.lastWorkflow) {
          configureAgentProposalActions(controls.lastWorkflow, controls);
        }
      }
    }

    async function undoAgentProposal(proposal, controls) {
      controls.busy = true;
      for (const button of controls.buttons) {
        button.disabled = true;
      }
      controls.statusElement.textContent = "正在读取最新执行状态…";
      try {
        const workflow = await fetchAgentProposalWorkflow(proposal);
        syncAgentProposalWorkflow(proposal, workflow, controls);
        const snapshot = workflowSnapshot(workflow);
        if (snapshot === null) {
          throw new Error("undo snapshot unavailable");
        }
        if (
          workflow.approval_status !== "APPROVED" ||
          workflow.status !== "ready" ||
          workflow.operation?.overall_status !== "COMPLETED"
        ) {
          controls.statusElement.textContent =
            "当前提案不可撤销，未执行文件操作。";
          return;
        }

        controls.statusElement.textContent = "正在撤销文件操作…";
        const query = new URLSearchParams({
          expected_plan_id: snapshot.planId,
          expected_revision: String(snapshot.revision),
        });
        const response = await fetch(
          `/api/v1/workflows/${encodeURIComponent(proposal.workflow_id)}/undo?${query}`,
          {method: "POST"},
        );
        const payload = await response.json();
        if (!response.ok) {
          if (response.status === 409) {
            await refreshAgentProposalAfterConflict(
              proposal,
              controls,
              "计划状态已变化，已重新读取；未自动重试。",
            );
            return;
          }
          controls.statusElement.textContent = safeErrorMessage(
            payload,
            "撤销失败，请刷新提案后重试。",
          );
          return;
        }
        renderAgentExecutionItems(payload, controls, "撤销");

        try {
          const refreshedWorkflow = await fetchAgentProposalWorkflow(proposal);
          syncAgentProposalWorkflow(proposal, refreshedWorkflow, controls);
          if (payload.status === "UNDONE") {
            controls.statusElement.textContent = "撤销完成，文件已恢复。";
          }
        } catch {
          hideAgentProposalActions(controls);
          controls.lastWorkflow = null;
          controls.statusElement.textContent =
            "撤销响应已返回，但最新提案状态暂不可用；请刷新后确认。";
        }
      } catch {
        controls.statusElement.textContent = "撤销请求失败，请刷新提案后重试。";
      } finally {
        controls.busy = false;
        if (controls.lastWorkflow) {
          configureAgentProposalActions(controls.lastWorkflow, controls);
        }
      }
    }

    function showAgentProposals(proposals) {
      clearAgentProposals();
      if (!Array.isArray(proposals) || proposals.length === 0) {
        return;
      }

      agentProposalsPanel.hidden = false;
      const renderToken = proposalRenderToken;
      for (const proposal of proposals) {
        const item = document.createElement("li");
        const title = document.createElement("strong");
        title.textContent = `${String(proposal.operation_type)} 提案`;
        const meta = document.createElement("p");
        meta.className = "agent-proposal-meta";
        meta.textContent =
          `workflow_id：${String(proposal.workflow_id)}；plan_id：${String(proposal.plan_id)}`;
        const status = document.createElement("p");
        status.className = "agent-proposal-status";
        status.textContent = `审批状态：${String(proposal.approval_status)}`;
        const operationsList = document.createElement("ul");
        operationsList.className = "agent-proposal-operations";
        const actions = document.createElement("div");
        actions.className = "agent-proposal-actions";
        const approveButton = document.createElement("button");
        approveButton.type = "button";
        approveButton.textContent = "批准";
        const rejectButton = document.createElement("button");
        rejectButton.type = "button";
        rejectButton.textContent = "拒绝";
        const executeButton = document.createElement("button");
        executeButton.type = "button";
        executeButton.textContent = "执行";
        executeButton.hidden = true;
        executeButton.disabled = true;
        const undoButton = document.createElement("button");
        undoButton.type = "button";
        undoButton.textContent = "撤销";
        undoButton.hidden = true;
        undoButton.disabled = true;
        actions.append(approveButton, rejectButton, executeButton, undoButton);
        const executionStatus = document.createElement("p");
        executionStatus.className = "agent-proposal-execution-status";
        executionStatus.hidden = true;
        const executionList = document.createElement("ul");
        executionList.className = "agent-proposal-execution";
        executionList.hidden = true;
        const controls = {
          actions,
          approveButton,
          rejectButton,
          executeButton,
          undoButton,
          buttons: [approveButton, rejectButton, executeButton, undoButton],
          meta,
          statusElement: status,
          executionStatus,
          executionList,
          busy: false,
           lastWorkflow: null,
           stateLoaded: false,
        };
        configureAgentProposalActions(null, controls);
        status.textContent = "正在读取最新计划状态…";
        item.append(
          title,
          meta,
          status,
          operationsList,
          actions,
          executionStatus,
          executionList,
        );
        agentProposalList.append(item);
        approveButton.addEventListener("click", () => {
          void decideAgentProposal(
            proposal,
            "approve",
            controls,
          );
        });
        rejectButton.addEventListener("click", () => {
          void decideAgentProposal(
            proposal,
            "reject",
            controls,
          );
        });
        executeButton.addEventListener("click", () => {
          void executeAgentProposal(proposal, controls);
        });
        undoButton.addEventListener("click", () => {
          void undoAgentProposal(proposal, controls);
        });
        void loadAgentProposalDetails(
          proposal,
          status,
          operationsList,
          controls,
          renderToken,
        );
      }
    }

    function showPlanPreview(sources) {
      closeWorkflowEventStream();
      planTargets.replaceChildren();
      planList.replaceChildren();
      planStatus.textContent = "";
      planPanel.hidden = true;
      resetPlanActions();
      currentWorkflow = null;
      if (!Array.isArray(sources) || sources.length === 0) {
        return;
      }

      for (const [index, source] of sources.entries()) {
        const field = document.createElement("div");
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.id = `target-directory-${index}`;
        input.dataset.fileId = String(source.file_id);
        input.required = true;
        input.maxLength = 400;
        input.placeholder = "例如：reports/quarterly";
        label.htmlFor = input.id;
        label.textContent = `目标目录：${String(source.relative_path)}`;
        field.append(label, input);
        planTargets.append(field);
      }
      planPanel.hidden = false;
    }

    function showPlanResult(payload) {
      planList.replaceChildren();
      const plan = payload?.operation_plan;
      const operations = plan?.operations;
      const workflowId = payload?.workflow_id;
      const planId = plan?.plan_id;
      const snapshot = workflowSnapshot(payload);
      if (
        !plan ||
        !Array.isArray(operations) ||
        snapshot === null ||
        typeof workflowId !== "string" ||
        typeof planId !== "string"
      ) {
        planStatus.textContent = "计划响应不可用，请稍后重试。";
        planActions.hidden = true;
        currentWorkflow = null;
        return;
      }

      currentWorkflow = snapshot;
      rememberActiveWorkflow(snapshot.workflowId, snapshot.planId);
      planStatus.textContent =
        `计划 ${planId} 已生成，当前等待审批。`;
      showApprovalActions();
      startWorkflowEventStream(workflowId);
      for (const operation of operations) {
        const item = document.createElement("li");
        item.textContent = `${String(operation.source_relative_path)} → ${String(operation.target_relative_path)}`;
        planList.append(item);
      }
    }

    async function loadWorkspaces(preferredWorkspaceId = null) {
      try {
        const response = await fetch("/api/v1/workspaces");
        const payload = await response.json();
        if (!response.ok || !Array.isArray(payload)) {
          throw new Error("workspace request failed");
        }

        const currentWorkspaceId = workspaceSelect.value;
        workspaceSelect.replaceChildren();
        if (payload.length === 0) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "没有可用工作区";
          workspaceSelect.append(option);
          workspaceSelect.disabled = true;
          submitButton.disabled = true;
          workspaceActions.hidden = true;
          stopJobPolling();
          resetPendingApprovalDetail();
          pendingApprovalsPanel.hidden = true;
          showStatus("请先通过现有 API 添加并扫描工作区。");
          return false;
        }

        for (const workspace of payload) {
          const option = document.createElement("option");
          option.value = String(workspace.id);
          option.textContent = String(workspace.name);
          workspaceSelect.append(option);
        }
        const previousWorkspaceId =
          preferredWorkspaceId === null
            ? currentWorkspaceId
            : String(preferredWorkspaceId);
        const preferredWorkspaceExists = payload.some(
          (workspace) => String(workspace.id) === previousWorkspaceId,
        );
        workspaceSelect.value = preferredWorkspaceExists
          ? previousWorkspaceId
          : String(payload[0].id);
        workspaceSelect.disabled = false;
        submitButton.disabled = false;
        currentWorkspaceName =
          workspaceSelect.selectedOptions[0]?.textContent ?? "";
        updateWorkspaceActionState();
        void loadRecentRuns();
        void restoreWorkspaceJobs();
        void loadPendingApprovals();
        return true;
      } catch {
        workspaceSelect.replaceChildren();
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "工作区加载失败";
        workspaceSelect.append(option);
        workspaceSelect.disabled = true;
        submitButton.disabled = true;
        workspaceActions.hidden = true;
        stopJobPolling();
        resetPendingApprovalDetail();
        pendingApprovalsPanel.hidden = true;
        showStatus("工作区当前不可用，请稍后重试。");
        return false;
      }
    }

    workspaceForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const name = workspaceNameInput.value.trim();
      const rootPath = workspaceRootPathInput.value.trim();
      if (!name || !rootPath) {
        workspaceStatus.textContent = "请填写工作区名称和根路径。";
        return;
      }

      addWorkspaceButton.disabled = true;
      workspaceStatus.textContent = "正在新增工作区…";
      try {
        const response = await fetch("/api/v1/workspaces", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({name, root_path: rootPath}),
        });
        const payload = await response.json();
        if (!response.ok || !Number.isInteger(payload?.id)) {
          workspaceStatus.textContent = safeErrorMessage(
            payload,
            "工作区创建失败，请检查根路径后重试。",
          );
          return;
        }

        const refreshed = await loadWorkspaces(payload.id);
        if (!refreshed || workspaceSelect.value !== String(payload.id)) {
          workspaceStatus.textContent =
            "工作区已创建，但列表刷新失败，请稍后刷新页面确认。";
          return;
        }
        workspaceNameInput.value = "";
        workspaceRootPathInput.value = "";
        workspaceStatus.textContent = `工作区“${name}”已新增并选中。`;
      } catch {
        workspaceStatus.textContent = "无法连接 FileNest API，请稍后重试。";
      } finally {
        addWorkspaceButton.disabled = false;
      }
    });

      void loadPendingApprovals();

      void submitPendingDecision("reject");
    });

    pendingCancelButton.addEventListener("click", () => {
      void submitPendingDecision("cancel");
    });

    pendingEditButton.addEventListener("click", () => {
      if (pendingApprovalActionState()?.edit !== true) {
        return;
      }
      pendingEditMode = true;
      pendingEditForm.hidden = false;
      configurePendingApprovalActions();
    });

    pendingEditCancelButton.addEventListener("click", () => {
      pendingEditMode = false;
      configurePendingApprovalActions();
    });

    pendingEditForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const changes = [
        ...pendingEditTargets.querySelectorAll("input[data-file-id]"),
      ].map((input) => ({
        source_file_id: Number(input.dataset.fileId),
        target_directory: input.value.trim(),
      }));
      if (
        changes.length === 0 ||
        changes.some(
          (change) =>
            !Number.isInteger(change.source_file_id) ||
            change.source_file_id < 1 ||
            !change.target_directory,
        )
      ) {
        pendingApprovalDetailStatus.textContent = "请为每个文件填写目标目录。";
        return;
      }
      void submitPendingDecision("edit", changes);
    });

    pendingExecuteButton.addEventListener("click", () => {
      void submitPendingFileAction("execute");
    });

    pendingUndoButton.addEventListener("click", () => {
      void submitPendingFileAction("undo");
    });

    planForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!workspaceSelect.value || currentSources.length === 0) {
        return;
      }

      const inputs = [
        ...planTargets.querySelectorAll("input[data-file-id]"),
      ];
      const selections = inputs.map((input) => ({
        source_file_id: Number(input.dataset.fileId),
        target_directory: input.value.trim(),
      }));
      if (selections.some((selection) => !selection.target_directory)) {
        planStatus.textContent = "请为每个出处填写目标目录。";
        return;
      }

      previewPlanButton.disabled = true;
      planStatus.textContent = "计划生成中…";
      planList.replaceChildren();
      try {
        const targetDirectories = [
          ...new Set(selections.map((selection) => selection.target_directory)),
        ];
        const response = await fetch("/api/v1/workflows", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            workspace_id: Number(workspaceSelect.value),
            target_directories: targetDirectories,
            selections,
          }),
        });
        const payload = await response.json();
        if (!response.ok) {
          planStatus.textContent = safeErrorMessage(
            payload,
            "计划生成失败，请稍后重试。",
          );
          return;
        }
        showPlanResult(payload);
      } catch {
        planStatus.textContent = "无法连接 FileNest API，请稍后重试。";
      } finally {
        previewPlanButton.disabled = false;
      }
    });

    async function submitPlanDecision(action) {
      if (!currentWorkflow) {
        return;
      }

      const workflowId = currentWorkflow.workflowId;
      approvePlanButton.disabled = true;
      rejectPlanButton.disabled = true;
      planStatus.textContent = action === "approve" ? "批准提交中…" : "拒绝提交中…";
      try {
        const workflow = await fetchWorkflowState(workflowId);
        const snapshot = applyCurrentWorkflowState(workflow);
        if (
          workflow.approval_status !== "WAITING_APPROVAL" ||
          workflow.status !== "waiting" ||
          workflow.operation?.overall_status !== "WAITING_APPROVAL"
        ) {
          configureCurrentPlanActions(workflow);
          planStatus.textContent = "计划状态已变化，未执行写操作。";
          return;
        }
        const response = await fetch(
          `/api/v1/workflows/${encodeURIComponent(workflowId)}/decisions`,
          {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              action,
              expected_plan_id: snapshot.planId,
              expected_revision: snapshot.revision,
            }),
          },
        );
        const payload = await response.json();
        if (!response.ok) {
          if (response.status === 409) {
            await refreshCurrentPlanAfterConflict(
              "计划状态已变化，已重新读取；未自动重试写操作。",
            );
            return;
          }
          planStatus.textContent = safeErrorMessage(
            payload,
            "审批提交失败，请刷新计划后重试。",
          );
          return;
        }

        const updatedSnapshot = workflowSnapshot(payload);
        if (updatedSnapshot === null) {
          throw new Error("approval result unavailable");
        }
        configureCurrentPlanActions(payload);
        if (payload.approval_status === "APPROVED") {
          planStatus.textContent = "计划已批准，尚未执行文件操作。";
        } else if (
          payload.approval_status === "REJECTED" ||
          payload.approval_status === "CANCELLED"
        ) {
          planStatus.textContent = "计划已拒绝。";
          clearActiveWorkflow(updatedSnapshot.workflowId);
          currentWorkflow = null;
          resetPlanActions();
        } else {
          planStatus.textContent = "审批状态已更新。";
        }
      } catch {
        planStatus.textContent = "无法连接 FileNest API，请稍后重试。";
      } finally {
        if (currentWorkflow && !approvePlanButton.hidden) {
          approvePlanButton.disabled = false;
          rejectPlanButton.disabled = false;
        }
      }
    }

    async function executeCurrentPlan() {
      if (!currentWorkflow) {
        return;
      }

      const workflowId = currentWorkflow.workflowId;
      executePlanButton.disabled = true;
      planStatus.textContent = "正在读取最新执行状态…";
      try {
        const workflow = await fetchWorkflowState(workflowId);
        const snapshot = applyCurrentWorkflowState(workflow);
        if (
          workflow.approval_status !== "APPROVED" ||
          workflow.status !== "ready" ||
          workflow.operation?.overall_status !== "APPROVED"
        ) {
          configureCurrentPlanActions(workflow);
          planStatus.textContent = "当前计划不可执行，未执行文件操作。";
          return;
        }

        const query = new URLSearchParams({
          expected_plan_id: snapshot.planId,
          expected_revision: String(snapshot.revision),
        });
        planStatus.textContent = "文件执行中…";
        const response = await fetch(
          `/api/v1/workflows/${encodeURIComponent(workflowId)}/execute?${query}`,
          {method: "POST"},
        );
        const payload = await response.json();
        if (!response.ok) {
          if (response.status === 409) {
            await refreshCurrentPlanAfterConflict(
              "计划状态已变化，已重新读取；未自动重试写操作。",
            );
            return;
          }
          planStatus.textContent = safeErrorMessage(
            payload,
            "文件执行失败，请检查当前文件状态。",
          );
          return;
        }

        if (payload.status === "COMPLETED") {
          const refreshed = await refreshCurrentPlanState(
            "计划已执行，文件已移动，可以撤销。",
          );
          if (!refreshed) {
            return;
          }
        } else {
          const refreshed = await refreshCurrentPlanState(
            `执行结果：${String(payload.status)}。`,
          );
          if (!refreshed) {
            return;
          }
        }
      } catch {
        planStatus.textContent = "无法连接 FileNest API，请稍后重试。";
      } finally {
        if (currentWorkflow && !executePlanButton.hidden) {
          executePlanButton.disabled = false;
        }
      }
    }

    async function undoCurrentPlan() {
      if (!currentWorkflow) {
        return;
      }

      const workflowId = currentWorkflow.workflowId;
      undoPlanButton.disabled = true;
      planStatus.textContent = "正在读取最新撤销状态…";
      try {
        const workflow = await fetchWorkflowState(workflowId);
        const snapshot = applyCurrentWorkflowState(workflow);
        if (
          workflow.approval_status !== "APPROVED" ||
          workflow.status !== "ready" ||
          workflow.operation?.overall_status !== "COMPLETED"
        ) {
          configureCurrentPlanActions(workflow);
          planStatus.textContent = "当前计划不可撤销，未执行文件操作。";
          return;
        }

        const query = new URLSearchParams({
          expected_plan_id: snapshot.planId,
          expected_revision: String(snapshot.revision),
        });
        planStatus.textContent = "撤销执行中…";
        const response = await fetch(
          `/api/v1/workflows/${encodeURIComponent(workflowId)}/undo?${query}`,
          {method: "POST"},
        );
        const payload = await response.json();
        if (!response.ok) {
          if (response.status === 409) {
            await refreshCurrentPlanAfterConflict(
              "计划状态已变化，已重新读取；未自动重试写操作。",
            );
            return;
          }
          planStatus.textContent = safeErrorMessage(
            payload,
            "撤销失败，请检查当前文件状态。",
          );
          return;
        }

        if (payload.status === "UNDONE") {
          planStatus.textContent = "执行已撤销，文件已恢复原位置。";
          clearActiveWorkflow(workflowId);
          currentWorkflow = null;
          resetPlanActions();
        } else {
          await refreshCurrentPlanState(
            `撤销结果：${String(payload.status)}。`,
          );
        }
      } catch {
        planStatus.textContent = "无法连接 FileNest API，请稍后重试。";
      } finally {
        if (currentWorkflow && !undoPlanButton.hidden) {
          undoPlanButton.disabled = false;
        }
      }
    }

    approvePlanButton.addEventListener("click", () => {
      submitPlanDecision("approve");
    });

    rejectPlanButton.addEventListener("click", () => {
      submitPlanDecision("reject");
    });

    executePlanButton.addEventListener("click", () => {
      executeCurrentPlan();
    });

    undoPlanButton.addEventListener("click", () => {
      undoCurrentPlan();
    });

    async function restoreActiveRun() {
      const runId = readActiveRun();
      if (runId === null) {
        return;
      }

      resetRunTimeline();
      showSources([]);
      showAgentProposals([]);
      showPlanPreview([]);
      resultStatus.textContent = `运行 #${runId} 正在恢复…`;
      const payload = await loadRunResult(runId, currentWorkspaceName);
      if (
        payload !== null &&
        !TERMINAL_RUN_STATUSES.has(payload.status)
      ) {
        startRunEventStream(runId, currentWorkspaceName);
      }
    }

    loadWorkspaces().then(restoreActiveRun);
  </script>
</body>
</html>
