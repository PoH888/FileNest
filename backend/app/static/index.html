<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FileNest</title>
  <style>
    body {
      max-width: 48rem;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1f2937;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }
    form, #run-result {
      display: grid;
      gap: 0.75rem;
    }
    textarea, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 0.65rem;
      font: inherit;
    }
    input[type="text"] {
      box-sizing: border-box;
      width: 100%;
      padding: 0.65rem;
      font: inherit;
    }
    textarea {
      min-height: 7rem;
      resize: vertical;
    }
    button {
      width: auto;
      justify-self: start;
    }
    #run-result {
      margin-top: 1.5rem;
      border-top: 1px solid #d1d5db;
      padding-top: 1rem;
    }
    #recent-runs-panel {
      margin-top: 1.5rem;
      border-top: 1px solid #d1d5db;
      padding-top: 1rem;
    }
    #recent-runs-list {
      margin: 0;
      padding-left: 1.25rem;
    }
    #recent-runs-list li + li {
      margin-top: 0.5rem;
    }
    .recent-run-button {
      width: 100%;
      text-align: left;
    }
    .recent-run-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.35rem;
    }
    #result-answer {
      white-space: pre-wrap;
    }
    #result-sources[hidden] {
      display: none;
    }
    #agent-proposals-panel[hidden] {
      display: none;
    }
    #agent-proposal-list {
      margin: 0;
      padding-left: 1.25rem;
    }
    #agent-proposal-list li + li {
      margin-top: 0.75rem;
    }
    .agent-proposal-meta,
    .agent-proposal-status,
    .agent-proposal-execution-status {
      margin: 0.25rem 0 0;
    }
    .agent-proposal-operations {
      margin: 0.25rem 0 0;
      padding-left: 1.25rem;
    }
    .agent-proposal-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .agent-proposal-execution {
      margin: 0.25rem 0 0;
      padding-left: 1.25rem;
    }
    #timeline-panel[hidden] {
      display: none;
    }
    #timeline-list {
      margin: 0;
      padding-left: 1.25rem;
    }
    #timeline-list li + li {
      margin-top: 0.35rem;
    }
    #plan-panel[hidden] {
      display: none;
    }
    #plan-targets {
      display: grid;
      gap: 0.75rem;
    }
    #plan-targets input {
      box-sizing: border-box;
      width: 100%;
      padding: 0.65rem;
      font: inherit;
    }
    #plan-list {
      margin: 0;
      padding-left: 1.25rem;
    }
    #plan-actions {
      display: flex;
      gap: 0.75rem;
    }
    #workspace-management,
    #workspace-actions {
      margin-top: 1.5rem;
      border-top: 1px solid #d1d5db;
      padding-top: 1rem;
    }
    #workspace-actions[hidden] {
      display: none;
    }
    #workspace-job-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    #pending-approvals-panel[hidden],
    #pending-approval-detail[hidden],
    #pending-edit-form[hidden] {
      display: none;
    }
    #pending-approvals-panel,
    #pending-approval-detail {
      margin-top: 1.5rem;
      border-top: 1px solid #d1d5db;
      padding-top: 1rem;
    }
    #pending-approvals-list,
    #pending-approval-operations {
      margin: 0;
      padding-left: 1.25rem;
    }
    #pending-approvals-list li + li {
      margin-top: 0.5rem;
    }
    .pending-approval-button {
      width: 100%;
      text-align: left;
    }
    .pending-approval-actions,
    .pending-edit-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .pending-approval-meta,
    .pending-approval-status {
      margin: 0.25rem 0 0;
    }
    #pending-edit-targets {
      display: grid;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>FileNest</h1>
    <p>在已授权工作区中提交一次只读文件查询。</p>

    <section id="workspace-management" aria-labelledby="workspace-management-heading">
      <h2 id="workspace-management-heading">工作区初始化</h2>
      <form id="workspace-form">
        <label for="workspace-name">工作区名称</label>
        <input
          id="workspace-name"
          name="name"
          type="text"
          maxlength="200"
          required
          placeholder="例如：我的资料"
        >
        <label for="workspace-root-path">本机根路径</label>
        <input
          id="workspace-root-path"
          name="root_path"
          type="text"
          maxlength="4000"
          required
          autocomplete="off"
          placeholder="例如：D:\Documents"
        >
        <button id="add-workspace" type="submit">新增工作区</button>
      </form>
      <p id="workspace-status" role="status" aria-live="polite">
        输入服务端可访问的本机目录后新增工作区。
      </p>
      <section id="workspace-actions" aria-labelledby="workspace-actions-heading" hidden>
        <h3 id="workspace-actions-heading">扫描与索引</h3>
        <div id="workspace-job-actions">
          <button id="scan-workspace" type="button">扫描工作区</button>
          <button id="index-documents" type="button">建立文档索引</button>
        </div>
        <p id="job-status" role="status" aria-live="polite">
          当前没有未完成的初始化任务。
        </p>
      </section>
    </section>

    <section
      id="pending-approvals-panel"
      aria-labelledby="pending-approvals-heading"
      hidden
    >
      <h2 id="pending-approvals-heading">待审批计划</h2>
      <p id="pending-approvals-status" role="status" aria-live="polite">
        选择工作区后加载。
      </p>
      <ul id="pending-approvals-list"></ul>
      <section id="pending-approval-detail" aria-labelledby="pending-approval-detail-heading" hidden>
        <h3 id="pending-approval-detail-heading">计划详情</h3>
        <p id="pending-approval-summary" class="pending-approval-meta"></p>
        <p id="pending-approval-detail-status" class="pending-approval-status" role="status" aria-live="polite"></p>
        <ul id="pending-approval-operations"></ul>
        <div id="pending-approval-actions" class="pending-approval-actions" hidden>
          <button id="pending-approve" type="button">批准</button>
          <button id="pending-reject" type="button">拒绝</button>
          <button id="pending-cancel" type="button">取消</button>
          <button id="pending-edit" type="button">编辑目标</button>
          <button id="pending-execute" type="button" hidden>执行</button>
          <button id="pending-undo" type="button" hidden>撤销</button>
        </div>
        <form id="pending-edit-form" hidden>
          <div id="pending-edit-targets"></div>
          <div class="pending-edit-actions">
            <button id="pending-edit-submit" type="submit">提交编辑</button>
            <button id="pending-edit-cancel" type="button">放弃编辑</button>
          </div>
        </form>
        <p id="pending-execution-status" role="status" aria-live="polite"></p>
        <ul id="pending-execution-list"></ul>
      </section>
    </section>

    <form id="request-form">
      <label for="workspace-select">工作区</label>
      <select id="workspace-select" name="workspace_id" required disabled>
        <option value="">正在加载工作区…</option>
      </select>

      <label for="request-text">请求</label>
      <textarea
        id="request-text"
        name="request_text"
        maxlength="2000"
        required
        placeholder="例如：查找季度报告"
      ></textarea>

      <button id="submit-request" type="submit" disabled>提交只读请求</button>
    </form>

    <section id="recent-runs-panel" aria-labelledby="recent-runs-heading">
      <h2 id="recent-runs-heading">最近运行</h2>
      <p id="recent-runs-status" role="status" aria-live="polite">
        选择工作区后加载。
      </p>
      <ul id="recent-runs-list"></ul>
    </section>

    <section id="run-result" aria-labelledby="result-heading">
      <h2 id="result-heading">运行结果</h2>
      <p id="result-status" role="status" aria-live="polite">等待提交。</p>
      <section id="timeline-panel" aria-labelledby="timeline-heading" hidden>
        <h3 id="timeline-heading">运行时间线</h3>
        <ol id="timeline-list" aria-live="polite"></ol>
      </section>
      <p id="result-answer"></p>
      <section id="result-sources" aria-labelledby="sources-heading" hidden>
        <h3 id="sources-heading">文件出处</h3>
        <ul id="source-list"></ul>
      </section>
      <section
        id="agent-proposals-panel"
        aria-labelledby="agent-proposals-heading"
        hidden
      >
        <h3 id="agent-proposals-heading">Agent 提案</h3>
        <ul id="agent-proposal-list"></ul>
      </section>
      <section id="plan-panel" aria-labelledby="plan-heading" hidden>
        <h3 id="plan-heading">整理计划预览</h3>
        <form id="plan-form">
          <div id="plan-targets"></div>
          <button id="preview-plan" type="submit">生成计划预览</button>
        </form>
        <p id="plan-status" role="status" aria-live="polite"></p>
        <ul id="plan-list"></ul>
        <div id="plan-actions" hidden>
          <button id="approve-plan" type="button">批准计划</button>
          <button id="reject-plan" type="button">拒绝计划</button>
          <button id="execute-plan" type="button" hidden disabled>执行计划</button>
          <button id="undo-plan" type="button" hidden disabled>撤销执行</button>
        </div>
      </section>
    </section>
  </main>

  <script>
    const form = document.querySelector("#request-form");
    const workspaceForm = document.querySelector("#workspace-form");
    const workspaceNameInput = document.querySelector("#workspace-name");
    const workspaceRootPathInput = document.querySelector("#workspace-root-path");
    const addWorkspaceButton = document.querySelector("#add-workspace");
    const workspaceStatus = document.querySelector("#workspace-status");
    const workspaceSelect = document.querySelector("#workspace-select");
    const requestText = document.querySelector("#request-text");
    const submitButton = document.querySelector("#submit-request");
    const workspaceActions = document.querySelector("#workspace-actions");
    const scanWorkspaceButton = document.querySelector("#scan-workspace");
    const indexDocumentsButton = document.querySelector("#index-documents");
    const jobStatus = document.querySelector("#job-status");
    const pendingApprovalsPanel = document.querySelector(
      "#pending-approvals-panel",
    );
    const pendingApprovalsStatus = document.querySelector(
      "#pending-approvals-status",
    );
    const pendingApprovalsList = document.querySelector(
      "#pending-approvals-list",
    );
    const pendingApprovalDetail = document.querySelector(
      "#pending-approval-detail",
    );
    const pendingApprovalSummary = document.querySelector(
      "#pending-approval-summary",
    );
    const pendingApprovalDetailStatus = document.querySelector(
      "#pending-approval-detail-status",
    );
    const pendingApprovalOperations = document.querySelector(
      "#pending-approval-operations",
    );
    const pendingApprovalActions = document.querySelector(
      "#pending-approval-actions",
    );
    const pendingApproveButton = document.querySelector("#pending-approve");
    const pendingRejectButton = document.querySelector("#pending-reject");
    const pendingCancelButton = document.querySelector("#pending-cancel");
    const pendingEditButton = document.querySelector("#pending-edit");
    const pendingExecuteButton = document.querySelector("#pending-execute");
    const pendingUndoButton = document.querySelector("#pending-undo");
    const pendingEditForm = document.querySelector("#pending-edit-form");
    const pendingEditTargets = document.querySelector("#pending-edit-targets");
    const pendingEditSubmitButton = document.querySelector(
      "#pending-edit-submit",
    );
    const pendingEditCancelButton = document.querySelector(
      "#pending-edit-cancel",
    );
    const pendingExecutionStatus = document.querySelector(
      "#pending-execution-status",
    );
    const pendingExecutionList = document.querySelector(
      "#pending-execution-list",
    );
    const recentRunsStatus = document.querySelector("#recent-runs-status");
    const recentRunsList = document.querySelector("#recent-runs-list");
    const resultStatus = document.querySelector("#result-status");
    const resultAnswer = document.querySelector("#result-answer");
    const timelinePanel = document.querySelector("#timeline-panel");
    const timelineList = document.querySelector("#timeline-list");
    const resultSources = document.querySelector("#result-sources");
    const sourceList = document.querySelector("#source-list");
    const agentProposalsPanel = document.querySelector(
      "#agent-proposals-panel",
    );
    const agentProposalList = document.querySelector("#agent-proposal-list");
    const planPanel = document.querySelector("#plan-panel");
    const planForm = document.querySelector("#plan-form");
    const planTargets = document.querySelector("#plan-targets");
    const previewPlanButton = document.querySelector("#preview-plan");
    const planStatus = document.querySelector("#plan-status");
    const planList = document.querySelector("#plan-list");
    const planActions = document.querySelector("#plan-actions");
    const approvePlanButton = document.querySelector("#approve-plan");
    const rejectPlanButton = document.querySelector("#reject-plan");
    const executePlanButton = document.querySelector("#execute-plan");
    const undoPlanButton = document.querySelector("#undo-plan");
    let currentSources = [];
    let currentWorkflow = null;
    let activeRunEventSource = null;
    let activeWorkflowEventSource = null;
    let activeRunResultRequest = null;
    let activeRunResultRequestId = null;
    let currentWorkspaceName = "";
    let proposalRenderToken = 0;
    let recentRunsRequestToken = 0;
    let pendingApprovalsRequestToken = 0;
    let pendingApprovalDetailToken = 0;
    let currentPendingApproval = null;
    let pendingApprovalBusy = false;
    let pendingEditMode = false;
    let activeJobPollTimer = null;
    let jobPollToken = 0;
    let currentJob = null;
    const activeJobs = new Map();
    const ACTIVE_RUN_STORAGE_KEY = "filenest.active_agent_run_id";
    const ACTIVE_WORKFLOW_STORAGE_KEY = "filenest.active_workflow_id";
    const ACTIVE_PLAN_STORAGE_KEY = "filenest.active_plan_id";
    const ACTIVE_JOB_STORAGE_KEY_PREFIX = "filenest.active_job";

    const TERMINAL_RUN_STATUSES = new Set([
      "completed",
      "max_steps_reached",
      "timed_out",
      "cancelled",
      "failed",
    ]);
    const RUN_STATUS_LABELS = Object.freeze({
      pending: "等待中",
      running: "运行中",
      waiting_approval: "等待审批",
      completed: "已完成",
      max_steps_reached: "达到最大步数",
      timed_out: "超时",
      cancelled: "已取消",
      failed: "失败",
    });
    const ACTIVE_RUN_STATUSES = new Set([
      "pending",
      "running",
      "waiting_approval",
    ]);
    const RESUMABLE_RUN_STATUSES = new Set([
      "cancelled",
      "failed",
      "timed_out",
      "max_steps_reached",
    ]);
    const JOB_STATUS_LABELS = Object.freeze({
      pending: "等待中",
      running: "运行中",
      completed: "已完成",
      failed: "失败",
      cancelled: "已取消",
      cancel_requested: "取消中",
    });
    const TERMINAL_JOB_STATUSES = new Set([
      "completed",
      "failed",
      "cancelled",
    ]);
    const ACTIVE_JOB_STATUSES = new Set([
      "pending",
      "running",
      "cancel_requested",
    ]);
    const JOB_KIND_LABELS = Object.freeze({
      workspace_scan: "扫描",
      document_index: "文档索引",
    });
    const TOOL_STATUS_LABELS = Object.freeze({
      requested: "已请求",
      succeeded: "已完成",
      rejected: "已拒绝",
      failed: "失败",
    });
    const AGENT_LIFECYCLE_EVENT_TYPES = Object.freeze([
      "agent.started",
      "agent.step.started",
      "agent.step.completed",
      "agent.cancelled",
      "agent.resumed",
      "agent.error",
    ]);
    const WORKFLOW_EVENT_TYPES = Object.freeze([
      "approval.waiting",
      "approval.approved",
      "approval.rejected",
      "execution.started",
      "execution.item.completed",
      "execution.item.failed",
      "execution.completed",
      "undo.started",
      "undo.item.completed",
      "undo.completed",
    ]);

    function showStatus(message, answer = "") {
      resultStatus.textContent = message;
      resultAnswer.textContent = answer;
    }

    function safeErrorMessage(payload, fallback) {
      const message = payload?.detail?.message;
      return typeof message === "string" && message ? message : fallback;
    }

    function closeRunEventStream() {
      if (activeRunEventSource !== null) {
        activeRunEventSource.close();
        activeRunEventSource = null;
      }
    }

    function closeWorkflowEventStream() {
      if (activeWorkflowEventSource !== null) {
        activeWorkflowEventSource.close();
        activeWorkflowEventSource = null;
      }
    }

    function saveActiveRun(runId) {
      try {
        // 新请求会覆盖旧 Run；保留终态 Run 才能在刷新后恢复结果。
        window.localStorage.setItem(ACTIVE_RUN_STORAGE_KEY, String(runId));
      } catch {
        // 本地存储不可用时仍保留当前页面内的实时运行能力。
      }
    }

    function readActiveRun() {
      try {
        const runId = window.localStorage.getItem(ACTIVE_RUN_STORAGE_KEY);
        return /^\d+$/.test(runId ?? "") ? runId : null;
      } catch {
        return null;
      }
    }

    function clearActiveRun(runId = null) {
      try {
        if (
          runId === null ||
          window.localStorage.getItem(ACTIVE_RUN_STORAGE_KEY) === String(runId)
        ) {
          window.localStorage.removeItem(ACTIVE_RUN_STORAGE_KEY);
        }
      } catch {
        // 本地存储不可用时不影响当前页面的恢复尝试。
      }
    }

    function isStoredUuid(value) {
      return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(
        value ?? "",
      );
    }

    function readStoredWorkflowId() {
      try {
        const workflowId = window.localStorage.getItem(
          ACTIVE_WORKFLOW_STORAGE_KEY,
        );
        return isStoredUuid(workflowId) ? workflowId : null;
      } catch {
        return null;
      }
    }

    function rememberActiveWorkflow(workflowId, planId) {
      try {
        window.localStorage.setItem(
          ACTIVE_WORKFLOW_STORAGE_KEY,
          String(workflowId),
        );
        window.localStorage.setItem(ACTIVE_PLAN_STORAGE_KEY, String(planId));
      } catch {
        // 服务端状态仍然有效，存储不可用时只影响刷新后的自动选中。
      }
    }

    function clearActiveWorkflow(workflowId = null) {
      try {
        if (
          workflowId === null ||
          window.localStorage.getItem(ACTIVE_WORKFLOW_STORAGE_KEY) ===
            String(workflowId)
        ) {
          window.localStorage.removeItem(ACTIVE_WORKFLOW_STORAGE_KEY);
          window.localStorage.removeItem(ACTIVE_PLAN_STORAGE_KEY);
        }
      } catch {
        // 下一次加载仍以服务端待审批列表为准。
      }
    }

    function jobStorageKey(workspaceId, kind) {
      return `${ACTIVE_JOB_STORAGE_KEY_PREFIX}.${String(kind)}.${String(workspaceId)}`;
    }

    function readStoredJobId(workspaceId, kind) {
      try {
        const jobId = window.localStorage.getItem(
          jobStorageKey(workspaceId, kind),
        );
        return /^[0-9a-f-]{20,100}$/i.test(jobId ?? "") ? jobId : null;
      } catch {
        return null;
      }
    }

    function rememberJobId(workspaceId, kind, jobId) {
      try {
        window.localStorage.setItem(jobStorageKey(workspaceId, kind), String(jobId));
      } catch {
        // 状态仍由服务端保存，存储不可用时只影响刷新后的自动恢复。
      }
    }

    function forgetJobId(workspaceId, kind, jobId = null) {
      try {
        const key = jobStorageKey(workspaceId, kind);
        if (jobId === null || window.localStorage.getItem(key) === String(jobId)) {
          window.localStorage.removeItem(key);
        }
      } catch {
        // 无法清理本地句柄时，下一次恢复仍会以服务端 Job 列表为准。
      }
    }

    function jobKey(workspaceId, kind) {
      return `${String(workspaceId)}:${String(kind)}`;
    }

    function workspaceHasActiveJob(workspaceId) {
      const prefix = `${String(workspaceId)}:`;
      return [...activeJobs.keys()].some((key) => key.startsWith(prefix));
    }

    function updateWorkspaceActionState() {
      const workspaceId = workspaceSelect.value;
      workspaceActions.hidden = !workspaceId;
      const disabled = !workspaceId || workspaceHasActiveJob(workspaceId);
      scanWorkspaceButton.disabled = disabled;
      indexDocumentsButton.disabled = disabled;
    }

    function renderJobStatus(payload, kind = "") {
      const status = String(payload?.status ?? "");
      const statusLabel = JOB_STATUS_LABELS[status] ?? "状态未知";
      const kindLabel =
        JOB_KIND_LABELS[kind] ?? JOB_KIND_LABELS[payload?.kind] ?? "初始化";
      const attempts = Array.isArray(payload?.attempts) ? payload.attempts : [];
      const attempt = attempts.length > 0 ? attempts[attempts.length - 1] : null;
      const completedUnits = attempt?.completed_units;
      const totalUnits = attempt?.total_units;
      let progress = "";
      if (Number.isInteger(completedUnits) && Number.isInteger(totalUnits)) {
        progress = `；进度 ${String(completedUnits)}/${String(totalUnits)}`;
      } else if (Number.isInteger(completedUnits)) {
        progress = `；已处理 ${String(completedUnits)} 项`;
      }
      const phase =
        typeof attempt?.phase_code === "string" && attempt.phase_code
          ? `；阶段 ${attempt.phase_code}`
          : "";
      const error =
        typeof payload?.error_code === "string" && payload.error_code
          ? `；错误码 ${payload.error_code}`
          : "";
      jobStatus.textContent = `${kindLabel}任务：${statusLabel}（${status}）${progress}${phase}${error}`;
    }

    function stopJobPolling() {
      jobPollToken += 1;
      if (activeJobPollTimer !== null) {
        window.clearTimeout(activeJobPollTimer);
        activeJobPollTimer = null;
      }
      currentJob = null;
    }

    async function pollJobStatus(job, pollToken) {
      if (
        pollToken !== jobPollToken ||
        workspaceSelect.value !== String(job.workspaceId)
      ) {
        return;
      }

      try {
        const query = new URLSearchParams({
          workspace_id: String(job.workspaceId),
        });
        const response = await fetch(
          `/api/v1/jobs/${encodeURIComponent(job.jobId)}?${query}`,
        );
        const payload = await response.json();
        if (response.status === 404) {
          activeJobs.delete(jobKey(job.workspaceId, job.kind));
          forgetJobId(job.workspaceId, job.kind, job.jobId);
          jobStatus.textContent = "初始化任务不存在，请重新提交。";
          updateWorkspaceActionState();
          return;
        }
        if (
          !response.ok ||
          !payload ||
          typeof payload !== "object" ||
          String(payload.job_id) !== String(job.jobId) ||
          Number(payload.workspace_id) !== Number(job.workspaceId) ||
          typeof payload.status !== "string"
        ) {
          throw new Error("job status unavailable");
        }
        if (
          pollToken !== jobPollToken ||
          workspaceSelect.value !== String(job.workspaceId)
        ) {
          return;
        }

        currentJob = {...job, status: String(payload.status)};
        renderJobStatus(payload, job.kind);
        if (TERMINAL_JOB_STATUSES.has(String(payload.status))) {
          activeJobs.delete(jobKey(job.workspaceId, job.kind));
          forgetJobId(job.workspaceId, job.kind, job.jobId);
          updateWorkspaceActionState();
          return;
        }
        activeJobPollTimer = window.setTimeout(
          () => void pollJobStatus(job, pollToken),
          500,
        );
      } catch {
        if (
          pollToken !== jobPollToken ||
          workspaceSelect.value !== String(job.workspaceId)
        ) {
          return;
        }
        jobStatus.textContent = "任务状态暂时读取失败，正在重试…";
        activeJobPollTimer = window.setTimeout(
          () => void pollJobStatus(job, pollToken),
          1000,
        );
      }
    }

    function startJobPolling(jobId, kind, workspaceId) {
      stopJobPolling();
      const job = {
        jobId: String(jobId),
        kind: String(kind),
        workspaceId: Number(workspaceId),
      };
      activeJobs.set(jobKey(job.workspaceId, job.kind), job.jobId);
      rememberJobId(job.workspaceId, job.kind, job.jobId);
      jobStatus.textContent = `${JOB_KIND_LABELS[job.kind] ?? "初始化"}任务状态读取中…`;
      updateWorkspaceActionState();
      void pollJobStatus(job, jobPollToken);
    }

    async function restoreWorkspaceJobs() {
      const workspaceId = workspaceSelect.value;
      stopJobPolling();
      updateWorkspaceActionState();
      if (!workspaceId) {
        jobStatus.textContent = "选择工作区后加载任务。";
        return;
      }

      const storedJobs = new Map();
      for (const kind of Object.keys(JOB_KIND_LABELS)) {
        const jobId = readStoredJobId(workspaceId, kind);
        if (jobId !== null) {
          const key = jobKey(workspaceId, kind);
          activeJobs.set(key, jobId);
          storedJobs.set(key, {kind, jobId});
        }
      }
      updateWorkspaceActionState();
      const requestToken = jobPollToken;
      jobStatus.textContent = "正在恢复初始化任务…";
      try {
        const query = new URLSearchParams({workspace_id: workspaceId});
        const response = await fetch(`/api/v1/jobs?${query}`);
        const payload = await response.json();
        if (
          !response.ok ||
          !Array.isArray(payload) ||
          requestToken !== jobPollToken ||
          workspaceSelect.value !== workspaceId
        ) {
          throw new Error("job list unavailable");
        }

        const jobs = payload.filter(
          (job) =>
            job &&
            typeof job === "object" &&
            Number(job.workspace_id) === Number(workspaceId) &&
            typeof job.job_id === "string" &&
            typeof job.kind === "string",
        );
        const listedJobKeys = new Set(
          jobs.map((job) => jobKey(workspaceId, String(job.kind))),
        );
        for (const [key, stored] of storedJobs) {
          if (!listedJobKeys.has(key)) {
            activeJobs.delete(key);
            forgetJobId(workspaceId, stored.kind, stored.jobId);
          }
        }
        for (const job of jobs) {
          if (TERMINAL_JOB_STATUSES.has(String(job.status))) {
            activeJobs.delete(jobKey(workspaceId, job.kind));
            forgetJobId(workspaceId, job.kind, job.job_id);
          }
        }
        const unfinished = jobs.find((job) =>
          ACTIVE_JOB_STATUSES.has(String(job.status)),
        );
        if (unfinished) {
          startJobPolling(unfinished.job_id, unfinished.kind, workspaceId);
          return;
        }
        jobStatus.textContent = "当前没有未完成的初始化任务。";
        updateWorkspaceActionState();
      } catch {
        if (requestToken === jobPollToken && workspaceSelect.value === workspaceId) {
          jobStatus.textContent = "初始化任务恢复失败，请稍后刷新。";
        }
      }
    }

    async function submitWorkspaceJob(kind, endpoint, button) {
      const workspaceId = workspaceSelect.value;
      if (!workspaceId || workspaceHasActiveJob(workspaceId)) {
        return;
      }

      button.disabled = true;
      jobStatus.textContent = `${JOB_KIND_LABELS[kind] ?? "初始化"}任务提交中…`;
      try {
        const response = await fetch(endpoint, {method: "POST"});
        const payload = await response.json();
        if (!response.ok || typeof payload?.job_id !== "string") {
          jobStatus.textContent = safeErrorMessage(
            payload,
            "初始化任务提交失败，请稍后重试。",
          );
          return;
        }
        startJobPolling(payload.job_id, kind, workspaceId);
      } catch {
        jobStatus.textContent = "无法连接 FileNest API，请稍后重试。";
      } finally {
        updateWorkspaceActionState();
      }
    }

    function recentRunStatusLabel(status) {
      return RUN_STATUS_LABELS[status] ?? "处理中";
    }

    async function submitAgentRunAction(run, action, button) {
      const workspaceId = workspaceSelect.value;
      if (
        !workspaceId ||
        Number(run.workspace_id) !== Number(workspaceId) ||
        !Number.isInteger(run.run_id)
      ) {
        return;
      }

      button.disabled = true;
      resultStatus.textContent =
        action === "cancel"
          ? `运行 #${String(run.run_id)} 取消请求提交中…`
          : `运行 #${String(run.run_id)} 恢复请求提交中…`;
      try {
        const latest = await requestRunResult(run.run_id);
        const canCancel = ACTIVE_RUN_STATUSES.has(String(latest.status));
        const canResume = RESUMABLE_RUN_STATUSES.has(String(latest.status));
        if ((action === "cancel" && !canCancel) || (action === "resume" && !canResume)) {
          resultStatus.textContent =
            `运行 #${String(run.run_id)} 当前状态为${recentRunStatusLabel(latest.status)}，未执行操作。`;
          renderRunResult(latest, currentWorkspaceName);
          return;
        }

        const response = await fetch(
          `/api/v1/agent-runs/${encodeURIComponent(String(run.run_id))}/${action}`,
          {method: "POST"},
        );
        const payload = await response.json();
        if (!response.ok) {
          resultStatus.textContent = safeErrorMessage(
            payload,
            action === "cancel"
              ? "取消失败，请刷新运行状态。"
              : "恢复失败，请刷新运行状态。",
          );
          const refreshed = await loadRunResult(run.run_id, currentWorkspaceName);
          if (refreshed !== null && ACTIVE_RUN_STATUSES.has(refreshed.status)) {
            startRunEventStream(run.run_id, currentWorkspaceName);
          }
          return;
        }

        saveActiveRun(run.run_id);
        const refreshed = await loadRunResult(run.run_id, currentWorkspaceName);
        if (refreshed !== null && !TERMINAL_RUN_STATUSES.has(refreshed.status)) {
          startRunEventStream(run.run_id, currentWorkspaceName);
        }
        void loadRecentRuns();
      } catch {
        resultStatus.textContent = "运行状态读取失败，请刷新后重试。";
      } finally {
        button.disabled = false;
      }
    }

    function renderRecentRuns(payload, requestToken) {
      if (requestToken !== recentRunsRequestToken) {
        return;
      }

      recentRunsList.replaceChildren();
      const items = Array.isArray(payload?.items) ? payload.items : [];
      if (items.length === 0) {
        recentRunsStatus.textContent = "当前工作区暂无运行记录。";
        return;
      }

      recentRunsStatus.textContent =
        `共 ${String(payload.total ?? items.length)} 条记录。`;
      for (const run of items) {
        if (!run || typeof run !== "object" || !Number.isInteger(run.run_id)) {
          continue;
        }

        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "recent-run-button";
        const request =
          typeof run.request_text === "string" && run.request_text
            ? run.request_text
            : "未命名请求";
        button.textContent =
          `#${String(run.run_id)} · ${recentRunStatusLabel(run.status)} · ${request}`;
        button.addEventListener("click", () => {
          const workspaceId = workspaceSelect.value;
          if (!workspaceId) {
            return;
          }

          resetRunTimeline();
          showSources([]);
          showAgentProposals([]);
          showPlanPreview([]);
          currentWorkspaceName =
            workspaceSelect.selectedOptions[0]?.textContent ?? "";
          saveActiveRun(run.run_id);
          resultStatus.textContent = `运行 #${String(run.run_id)} 正在加载…`;
          void loadRunResult(run.run_id, currentWorkspaceName).then(
            (loadedRun) => {
              if (
                loadedRun !== null &&
                !TERMINAL_RUN_STATUSES.has(loadedRun.status)
              ) {
                startRunEventStream(run.run_id, currentWorkspaceName);
              }
            },
          );
        });
        const actions = document.createElement("div");
        actions.className = "recent-run-actions";
        if (ACTIVE_RUN_STATUSES.has(String(run.status))) {
          const cancelButton = document.createElement("button");
          cancelButton.type = "button";
          cancelButton.textContent = "取消";
          cancelButton.addEventListener("click", (event) => {
            event.stopPropagation();
            void submitAgentRunAction(run, "cancel", cancelButton);
          });
          actions.append(cancelButton);
        }
        if (RESUMABLE_RUN_STATUSES.has(String(run.status))) {
          const resumeButton = document.createElement("button");
          resumeButton.type = "button";
          resumeButton.textContent = "恢复";
          resumeButton.addEventListener("click", (event) => {
            event.stopPropagation();
            void submitAgentRunAction(run, "resume", resumeButton);
          });
          actions.append(resumeButton);
        }
        item.append(button, actions);
        recentRunsList.append(item);
      }
    }

    async function loadRecentRuns() {
      const workspaceId = workspaceSelect.value;
      const requestToken = ++recentRunsRequestToken;
      recentRunsList.replaceChildren();
      if (!workspaceId) {
        recentRunsStatus.textContent = "选择工作区后加载。";
        return;
      }

      recentRunsStatus.textContent = "历史运行加载中…";
      try {
        const query = new URLSearchParams({
          workspace_id: workspaceId,
          page: "1",
          page_size: "10",
        });
        const response = await fetch(`/api/v1/agent-runs?${query}`);
        const payload = await response.json();
        if (!response.ok || !payload || typeof payload !== "object") {
          throw new Error("recent runs request failed");
        }
        renderRecentRuns(payload, requestToken);
      } catch {
        if (requestToken === recentRunsRequestToken) {
          recentRunsStatus.textContent = "历史运行加载失败，请稍后重试。";
        }
      }
    }

    function resetRunTimeline() {
      closeRunEventStream();
      closeWorkflowEventStream();
      timelineList.replaceChildren();
      timelinePanel.hidden = true;
    }

    function parseRunEvent(event) {
      try {
        const payload = JSON.parse(event.data);
        return payload && typeof payload === "object" ? payload : null;
      } catch {
        return null;
      }
    }

    function addRunTimelineItem(message) {
      const item = document.createElement("li");
      item.textContent = message;
      timelineList.append(item);
      timelinePanel.hidden = false;
    }

    function updateRunStatus(payload) {
      const runId = String(payload.run_id);
      if (payload.status === "running") {
        resultStatus.textContent = `运行 #${runId} 处理中…`;
        return;
      }
      if (payload.status === "completed") {
        resultStatus.textContent = `运行 #${runId} 已完成。`;
        return;
      }
      const errorSuffix =
        typeof payload.error_code === "string"
          ? `（${payload.error_code}）`
          : "";
      const statusLabel = RUN_STATUS_LABELS[payload.status] ?? "已停止";
      resultStatus.textContent =
        `运行 #${runId} ${statusLabel}${errorSuffix}。`;
    }

    function requestRunResult(runId) {
      const normalizedRunId = String(runId);
      if (
        activeRunResultRequest !== null &&
        activeRunResultRequestId === normalizedRunId
      ) {
        return activeRunResultRequest;
      }

      const request = (async () => {
        const query = new URLSearchParams({
          workspace_id: workspaceSelect.value,
        });
        const response = await fetch(
          `/api/v1/agent-runs/${encodeURIComponent(normalizedRunId)}?${query}`,
        );
        const payload = await response.json();
        if (response.status === 404) {
          clearActiveRun(normalizedRunId);
        }
        if (
          !response.ok ||
          !payload ||
          typeof payload !== "object" ||
          String(payload.run_id) !== normalizedRunId ||
          typeof payload.status !== "string"
        ) {
          throw new Error("Agent Run 当前状态不可用。");
        }
        return payload;
      })();
      activeRunResultRequest = request;
      activeRunResultRequestId = normalizedRunId;
      request.then(
        () => {
          if (activeRunResultRequest === request) {
            activeRunResultRequest = null;
            activeRunResultRequestId = null;
          }
        },
        () => {
          if (activeRunResultRequest === request) {
            activeRunResultRequest = null;
            activeRunResultRequestId = null;
          }
        },
      );
      return request;
    }

    function renderRunResult(payload, workspaceName = "") {
      updateRunStatus(payload);
      resultAnswer.textContent =
        typeof payload.final_answer === "string" ? payload.final_answer : "";
      if (payload.status === "completed") {
        showSources(payload.sources, workspaceName);
        showPlanPreview(payload.sources);
      } else {
        showSources([]);
        showPlanPreview([]);
      }
      showAgentProposals(payload.proposals);
    }

    async function loadRunResult(
      runId,
      workspaceName,
      eventSource = null,
      timelinePrefix = "",
    ) {
      try {
        const payload = await requestRunResult(runId);
        if (eventSource !== null && activeRunEventSource !== eventSource) {
          return null;
        }

        renderRunResult(payload, workspaceName);
        if (TERMINAL_RUN_STATUSES.has(payload.status)) {
          if (timelinePrefix) {
            addRunTimelineItem(
              `${timelinePrefix}：${describeRunEvent(payload)}`,
            );
          }
          if (eventSource !== null && activeRunEventSource === eventSource) {
            eventSource.close();
            activeRunEventSource = null;
          }
          void loadRecentRuns();
        } else if (timelinePrefix) {
          addRunTimelineItem(`实时连接恢复中：${describeRunEvent(payload)}`);
          resultStatus.textContent = `运行 #${runId} 实时连接恢复中…`;
        }
        return payload;
      } catch {
        if (eventSource !== null && activeRunEventSource === eventSource) {
          eventSource.close();
          activeRunEventSource = null;
        }
        resultStatus.textContent = eventSource === null
          ? "当前状态读取失败，请稍后刷新。"
          : "当前状态补取失败，请稍后刷新。";
        return null;
      }
    }

    function describeRunEvent(payload) {
      const runId = String(payload.run_id);
      if (payload.status === "running") {
        return `运行 #${runId} 已开始。`;
      }
      if (payload.status === "completed") {
        return `运行 #${runId} 已完成。`;
      }
      const errorSuffix =
        typeof payload.error_code === "string"
          ? `（${payload.error_code}）`
          : "";
      const statusLabel = RUN_STATUS_LABELS[payload.status] ?? "已停止";
      return `运行 #${runId} ${statusLabel}${errorSuffix}。`;
    }

    function describeToolEvent(payload) {
      const sequenceNo = String(payload.sequence_no);
      const toolName = String(payload.tool_name);
      const statusLabel = TOOL_STATUS_LABELS[payload.status] ?? "状态已更新";
      const errorSuffix =
        typeof payload.error_code === "string"
          ? `（${payload.error_code}）`
          : "";
      return `工具调用 ${sequenceNo}：${toolName}${statusLabel}${errorSuffix}。`;
    }

    function describeAgentLifecycleEvent(payload, eventType) {
      const runId = String(payload.run_id);
      if (eventType === "agent.started") {
        return `运行 #${runId} 已开始。`;
      }
      if (eventType === "agent.resumed") {
        return `运行 #${runId} 已恢复。`;
      }
      if (eventType === "agent.step.started") {
        return `Agent 步骤 ${String(payload.step_index)}：${String(payload.step_type)} 开始。`;
      }
      if (eventType === "agent.step.completed") {
        const statusLabel = TOOL_STATUS_LABELS[payload.status] ?? "状态已更新";
        const errorSuffix =
          typeof payload.error_code === "string"
            ? `（${payload.error_code}）`
            : "";
        return `Agent 步骤 ${String(payload.step_index)}：${String(payload.step_type)}${statusLabel}${errorSuffix}。`;
      }
      if (eventType === "agent.cancelled") {
        return `运行 #${runId} 已取消。`;
      }
      const errorSuffix =
        typeof payload.error_code === "string"
          ? `（${payload.error_code}）`
          : "";
      return `运行 #${runId} 出错${errorSuffix}。`;
    }

    function handleRunEvent(runId, eventType, event, eventSource) {
      const payload = parseRunEvent(event);
      if (
        payload === null ||
        (AGENT_LIFECYCLE_EVENT_TYPES.includes(eventType) &&
          String(payload.run_id) !== String(runId)) ||
        (eventType === "agent_run.status_changed" &&
          String(payload.run_id) !== String(runId))
      ) {
        eventSource.close();
        if (activeRunEventSource === eventSource) {
          activeRunEventSource = null;
        }
        resultStatus.textContent = "实时状态数据不可用。";
        return;
      }

      if (AGENT_LIFECYCLE_EVENT_TYPES.includes(eventType)) {
        if (eventType === "agent.started" || eventType === "agent.resumed") {
          resultStatus.textContent = `运行 #${runId} 处理中…`;
        } else if (eventType === "agent.cancelled") {
          resultStatus.textContent = `运行 #${runId} 已取消。`;
        } else if (eventType === "agent.error") {
          resultStatus.textContent = `运行 #${runId} 失败（${String(payload.error_code)}）。`;
        }
        addRunTimelineItem(describeAgentLifecycleEvent(payload, eventType));
        if (eventType === "agent.cancelled" || eventType === "agent.error") {
          void loadRunResult(runId, currentWorkspaceName, eventSource);
        }
        return;
      }

      if (eventType === "agent_run.status_changed") {
        updateRunStatus(payload);
        if (payload.status !== "running") {
          addRunTimelineItem(describeRunEvent(payload));
        }
        if (TERMINAL_RUN_STATUSES.has(payload.status)) {
          void loadRunResult(runId, currentWorkspaceName, eventSource);
        }
        return;
      }

      if (eventType === "agent_tool_call.status_changed") {
        return;
      }
    }

    async function recoverRunEventStream(runId, eventSource) {
      resultStatus.textContent = `运行 #${runId} 正在补取当前状态…`;
      await loadRunResult(
        runId,
        currentWorkspaceName,
        eventSource,
        "当前状态补取",
      );
      // 保持同一 EventSource，由浏览器携带 Last-Event-ID 自动续接。
    }

    function startRunEventStream(runId, workspaceName = "") {
      closeRunEventStream();
      timelineList.replaceChildren();
      timelinePanel.hidden = false;
      currentWorkspaceName = workspaceName;
      if (typeof EventSource !== "function") {
        addRunTimelineItem("当前浏览器不支持实时状态。");
        void loadRunResult(runId, workspaceName);
        return;
      }

      let recoveryInProgress = false;
      const eventSource = new EventSource(
        `/api/v1/agent-runs/${encodeURIComponent(runId)}/events`,
      );
      activeRunEventSource = eventSource;
      eventSource.addEventListener("agent_run.status_changed", (event) => {
        handleRunEvent(
          runId,
          "agent_run.status_changed",
          event,
          eventSource,
        );
      });
      eventSource.addEventListener(
        "agent_tool_call.status_changed",
        (event) => {
          handleRunEvent(
            runId,
            "agent_tool_call.status_changed",
            event,
            eventSource,
          );
        },
      );
      for (const eventType of AGENT_LIFECYCLE_EVENT_TYPES) {
        eventSource.addEventListener(eventType, (event) => {
          handleRunEvent(runId, eventType, event, eventSource);
        });
      }
      eventSource.onerror = async () => {
        if (
          recoveryInProgress ||
          activeRunEventSource !== eventSource
        ) {
          return;
        }

        recoveryInProgress = true;
        await recoverRunEventStream(runId, eventSource);
        recoveryInProgress = false;
      };
    }

    function describeWorkflowEvent(payload, eventType) {
      if (eventType === "approval.waiting") {
        return `计划 ${String(payload.plan_id)} 等待审批。`;
      }
      if (eventType === "approval.approved") {
        return `计划 ${String(payload.plan_id)} 已批准。`;
      }
      if (eventType === "approval.rejected") {
        const resultLabel = payload.action === "cancel" ? "已取消" : "已拒绝";
        return `计划 ${String(payload.plan_id)} ${resultLabel}。`;
      }
      if (eventType === "execution.started") {
        return "文件执行已开始。";
      }
      if (eventType === "execution.item.completed") {
        return `执行项 ${String(payload.sequence_no)} 已完成。`;
      }
      if (eventType === "execution.item.failed") {
        const errorSuffix =
          typeof payload.error_code === "string"
            ? `（${payload.error_code}）`
            : "";
        return `执行项 ${String(payload.sequence_no)} 失败${errorSuffix}。`;
      }
      if (eventType === "execution.completed") {
        return `文件执行已结束：${String(payload.status)}。`;
      }
      if (eventType === "undo.started") {
        return "撤销执行已开始。";
      }
      if (eventType === "undo.item.completed") {
        return `撤销项 ${String(payload.sequence_no)} 已完成。`;
      }
      return "执行已撤销完成。";
    }

    function handleWorkflowEvent(
      workflowId,
      eventType,
      event,
      eventSource,
    ) {
      const payload = parseRunEvent(event);
      if (
        payload === null ||
        String(payload.workflow_id) !== String(workflowId)
      ) {
        eventSource.close();
        if (activeWorkflowEventSource === eventSource) {
          activeWorkflowEventSource = null;
        }
        planStatus.textContent = "实时计划状态数据不可用。";
        return;
      }

      addRunTimelineItem(describeWorkflowEvent(payload, eventType));
      if (eventType === "approval.waiting") {
        planStatus.textContent = "计划等待审批。";
      } else if (eventType === "approval.approved") {
        void refreshCurrentPlanState("计划已批准，尚未执行文件操作。");
      } else if (eventType === "approval.rejected") {
        planStatus.textContent =
          payload.action === "cancel" ? "计划已取消。" : "计划已拒绝。";
        currentWorkflow = null;
        eventSource.close();
        activeWorkflowEventSource = null;
        resetPlanActions();
      } else if (eventType === "execution.started") {
        planStatus.textContent = "文件执行中…";
      } else if (eventType === "execution.item.failed") {
        planStatus.textContent = "部分文件执行失败。";
      } else if (eventType === "execution.completed") {
        if (payload.status === "COMPLETED") {
          void refreshCurrentPlanState("计划已执行，文件已移动，可以撤销。");
        } else {
          planStatus.textContent = `执行结果：${String(payload.status)}。`;
          eventSource.close();
          activeWorkflowEventSource = null;
        }
      } else if (eventType === "undo.started") {
        planStatus.textContent = "撤销执行中…";
      } else if (eventType === "undo.completed") {
        planStatus.textContent = "执行已撤销，文件已恢复原位置。";
        currentWorkflow = null;
        eventSource.close();
        activeWorkflowEventSource = null;
        resetPlanActions();
      }
    }

    function startWorkflowEventStream(workflowId) {
      closeWorkflowEventStream();
      if (typeof EventSource !== "function") {
        addRunTimelineItem("当前浏览器不支持实时计划状态。");
        return;
      }

      const eventSource = new EventSource(
        `/api/v1/workflows/${encodeURIComponent(workflowId)}/events`,
      );
      activeWorkflowEventSource = eventSource;
      for (const eventType of WORKFLOW_EVENT_TYPES) {
        eventSource.addEventListener(eventType, (event) => {
          handleWorkflowEvent(workflowId, eventType, event, eventSource);
        });
      }
      eventSource.onerror = () => {
        if (
          activeWorkflowEventSource === eventSource &&
          eventSource.readyState === EventSource.CLOSED
        ) {
          activeWorkflowEventSource = null;
        }
      };
    }

    function pendingApprovalItemIsValid(item, workspaceId) {
      return (
        item &&
        typeof item === "object" &&
        Number(item.workspace_id) === Number(workspaceId) &&
        typeof item.workflow_id === "string" &&
        typeof item.plan_id === "string" &&
        typeof item.approval_status === "string" &&
        typeof item.recovery_status === "string" &&
        Array.isArray(item.source_summary) &&
        Array.isArray(item.targets)
      );
    }

    function resetPendingApprovalDetail() {
      pendingApprovalDetailToken += 1;
      currentPendingApproval = null;
      pendingEditMode = false;
      pendingApprovalDetail.hidden = true;
      pendingApprovalActions.hidden = true;
      pendingEditForm.hidden = true;
      pendingApprovalSummary.textContent = "";
      pendingApprovalDetailStatus.textContent = "";
      pendingApprovalOperations.replaceChildren();
      pendingEditTargets.replaceChildren();
      pendingExecutionStatus.textContent = "";
      pendingExecutionList.replaceChildren();
    }

    function renderPendingApprovalPreview(item) {
      pendingApprovalDetail.hidden = false;
      pendingApprovalActions.hidden = true;
      pendingEditForm.hidden = true;
      pendingApprovalSummary.textContent =
        `Workflow ${String(item.workflow_id)}；Plan ${String(item.plan_id)}；revision ${String(item.current_revision)}`;
      pendingApprovalDetailStatus.textContent = "正在读取最新计划与恢复状态…";
      pendingApprovalOperations.replaceChildren();
      for (const source of item.source_summary) {
        const operation = document.createElement("li");
        operation.textContent =
          `${String(source.source_relative_path)} → ${String(source.target_relative_path)}`;
        pendingApprovalOperations.append(operation);
      }
    }

    function renderPendingApprovalDetails(plan, workflow) {
      const snapshot = workflowSnapshot(workflow);
      if (snapshot === null) {
        throw new Error("pending workflow snapshot unavailable");
      }

      const validation = String(plan.validation_status ?? "unknown");
      const recovery = String(plan.recovery_status ?? "unknown");
      const validationError =
        typeof plan.validation_error_code === "string" && plan.validation_error_code
          ? `；校验错误码 ${plan.validation_error_code}`
          : "";
      const recoveryError =
        typeof plan.recovery_error_code === "string" && plan.recovery_error_code
          ? `；恢复错误码 ${plan.recovery_error_code}`
          : "";
      const waitReason =
        typeof workflow.wait_reason_code === "string" && workflow.wait_reason_code
          ? `；等待原因 ${workflow.wait_reason_code}`
          : "";
      pendingApprovalSummary.textContent =
        `Workflow ${snapshot.workflowId}；Plan ${snapshot.planId}；revision ${String(snapshot.revision)}；工作流 ${String(workflow.status)}；审批 ${String(workflow.approval_status)}；校验 ${validation}；恢复 ${recovery}${validationError}${recoveryError}${waitReason}`;
      pendingApprovalDetailStatus.textContent = "最新计划与恢复状态已读取。";
      pendingApprovalOperations.replaceChildren();
      pendingEditMode = false;
      for (const operation of plan.operations) {
        const item = document.createElement("li");
        const risks = Array.isArray(operation.risks) ? operation.risks : [];
        const riskText = risks.length
          ? risks
              .map(
                (risk) =>
                  `${String(risk.level)} / ${String(risk.code)}：${String(risk.description)}`,
              )
              .join("；")
          : "无结构化风险";
        item.textContent =
          `${String(operation.source_relative_path)} → ${String(operation.target_relative_path)}；风险：${riskText}`;
        pendingApprovalOperations.append(item);
      }

      pendingEditTargets.replaceChildren();
      for (const operation of plan.operations) {
        const field = document.createElement("div");
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "text";
        input.required = true;
        input.maxLength = 400;
        input.dataset.fileId = String(operation.source_file_id);
        const targetPath = String(operation.target_relative_path);
        const slash = targetPath.lastIndexOf("/");
        input.value = slash > 0 ? targetPath.slice(0, slash) : "";
        label.htmlFor = `pending-target-${String(operation.source_file_id)}`;
        input.id = label.htmlFor;
        label.textContent = `目标目录：${String(operation.source_relative_path)}`;
        field.append(label, input);
        pendingEditTargets.append(field);
      }
      pendingEditForm.hidden = true;
      pendingApprovalDetail.hidden = false;
      configurePendingApprovalActions();
    }

    function pendingApprovalActionState() {
      const current = currentPendingApproval;
      if (current === null || current.workflow === null || current.plan === null) {
        return null;
      }
      const snapshot = workflowSnapshot(current.workflow);
      if (snapshot === null) {
        return null;
      }

      const waiting =
        current.workflow.status === "waiting" &&
        current.workflow.approval_status === "WAITING_APPROVAL" &&
        current.workflow.operation?.overall_status === "WAITING_APPROVAL";
      const safeForApproval =
        current.item.recovery_status === "available" &&
        current.plan.validation_status === "valid" &&
        current.plan.recovery_status === "available";
      const safeForExecution = current.plan.validation_status === "valid";
      const safeForUndo =
        String(current.plan.workflow_id) === snapshot.workflowId &&
        String(current.plan.plan_id) === snapshot.planId;
      return {
        snapshot,
        approve: waiting && safeForApproval,
        reject: waiting,
        cancel: waiting,
        edit: waiting && safeForApproval,
        execute:
          safeForExecution &&
          current.workflow.status === "ready" &&
          current.workflow.approval_status === "APPROVED" &&
          current.workflow.operation?.overall_status === "APPROVED",
        undo:
          safeForUndo &&
          current.workflow.status === "ready" &&
          current.workflow.approval_status === "APPROVED" &&
          current.workflow.operation?.overall_status === "COMPLETED",
      };
    }

    function configurePendingApprovalActions() {
      const state = pendingApprovalActionState();
      const buttons = [
        [pendingApproveButton, state?.approve === true],
        [pendingRejectButton, state?.reject === true],
        [pendingCancelButton, state?.cancel === true],
        [pendingEditButton, state?.edit === true],
        [pendingExecuteButton, state?.execute === true],
        [pendingUndoButton, state?.undo === true],
      ];
      const anyVisible = buttons.some(([, visible]) => visible);
      pendingApprovalActions.hidden = !anyVisible;
      for (const [button, visible] of buttons) {
        button.hidden = !visible;
        button.disabled = pendingApprovalBusy || !visible;
      }
      if (state?.edit !== true) {
        pendingEditMode = false;
        pendingEditForm.hidden = true;
      } else {
        pendingEditForm.hidden = !pendingEditMode;
      }
      pendingEditSubmitButton.disabled = pendingApprovalBusy;
      pendingEditCancelButton.disabled = pendingApprovalBusy;
    }

    async function loadPendingApprovalDetails(item, statusMessage = "") {
      const workspaceId = workspaceSelect.value;
      if (!pendingApprovalItemIsValid(item, workspaceId)) {
        return false;
      }
      const requestToken = ++pendingApprovalDetailToken;
      currentPendingApproval = {item, plan: null, workflow: null};
      rememberActiveWorkflow(item.workflow_id, item.plan_id);
      renderPendingApprovalPreview(item);
      try {
        const workflow = await fetchWorkflowState(item.workflow_id);
        const snapshot = workflowSnapshot(workflow);
        if (snapshot === null) {
          throw new Error("pending workflow snapshot unavailable");
        }
        const plan = await fetchOperationPlanDetail(snapshot.planId);
        if (
          requestToken !== pendingApprovalDetailToken ||
          workspaceSelect.value !== workspaceId ||
          String(plan.workflow_id) !== snapshot.workflowId
        ) {
          return false;
        }
        currentPendingApproval = {
          item: {
            ...item,
            plan_id: snapshot.planId,
            current_revision: snapshot.revision,
            approval_status: workflow.approval_status,
          },
          plan,
          workflow,
        };
        rememberActiveWorkflow(snapshot.workflowId, snapshot.planId);
        renderPendingApprovalDetails(plan, workflow);
        if (statusMessage) {
          pendingApprovalDetailStatus.textContent = statusMessage;
        }
        return true;
      } catch {
        if (requestToken === pendingApprovalDetailToken) {
          currentPendingApproval = null;
          pendingApprovalActions.hidden = true;
          pendingEditForm.hidden = true;
          pendingApprovalDetailStatus.textContent =
            "计划详情读取失败，未启用审批或文件操作按钮。";
        }
        return false;
      }
    }

    function renderPendingApprovalList(
      payload,
      requestToken,
      preserveSelectedApproval = false,
    ) {
      if (requestToken !== pendingApprovalsRequestToken) {
        return;
      }
      pendingApprovalsList.replaceChildren();
      const workspaceId = workspaceSelect.value;
      const items = Array.isArray(payload?.items)
        ? payload.items.filter((item) =>
            pendingApprovalItemIsValid(item, workspaceId),
          )
        : [];
      if (items.length === 0) {
        pendingApprovalsStatus.textContent = "当前工作区没有待审批计划。";
      } else {
        pendingApprovalsStatus.textContent =
          `共 ${String(payload.total ?? items.length)} 个待审批计划。`;
      }
      for (const approval of items) {
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "pending-approval-button";
        button.textContent =
          `${String(approval.operation_type)}；Workflow ${String(approval.workflow_id)}；Plan ${String(approval.plan_id)}；revision ${String(approval.current_revision)}`;
        button.addEventListener("click", () => {
          void loadPendingApprovalDetails(approval);
        });
        item.append(button);
        pendingApprovalsList.append(item);
      }

      if (!preserveSelectedApproval) {
        const storedWorkflowId = readStoredWorkflowId();
        const restored = items.find(
          (item) => item.workflow_id === storedWorkflowId,
        );
        if (restored) {
          void loadPendingApprovalDetails(restored);
        } else if (storedWorkflowId !== null) {
          clearActiveWorkflow(storedWorkflowId);
        }
      }
    }

    async function loadPendingApprovals(preserveSelectedApproval = false) {
      const workspaceId = workspaceSelect.value;
      const requestToken = ++pendingApprovalsRequestToken;
      if (!preserveSelectedApproval) {
        resetPendingApprovalDetail();
      }
      pendingApprovalsPanel.hidden = !workspaceId;
      if (!workspaceId) {
        pendingApprovalsStatus.textContent = "选择工作区后加载。";
        return;
      }

      pendingApprovalsStatus.textContent = "待审批计划加载中…";
      try {
        const query = new URLSearchParams({
          workspace_id: workspaceId,
          page: "1",
          page_size: "20",
        });
        const response = await fetch(`/api/v1/approvals/pending?${query}`);
        const payload = await response.json();
        if (
          !response.ok ||
          !payload ||
          typeof payload !== "object" ||
          !Array.isArray(payload.items) ||
          requestToken !== pendingApprovalsRequestToken ||
          workspaceSelect.value !== workspaceId
        ) {
          throw new Error("pending approval request failed");
        }
        renderPendingApprovalList(payload, requestToken, preserveSelectedApproval);
      } catch {
        if (requestToken === pendingApprovalsRequestToken) {
          pendingApprovalsStatus.textContent =
            "待审批计划加载失败，请稍后刷新。";
        }
      }
    }

    async function submitPendingDecision(action, changes = null) {
      if (currentPendingApproval === null || pendingApprovalBusy) {
        return;
      }
      pendingApprovalBusy = true;
      configurePendingApprovalActions();
      const item = currentPendingApproval.item;
      try {
        if (!(await loadPendingApprovalDetails(item))) {
          return;
        }
        const state = pendingApprovalActionState();
        const allowed =
          action === "approve"
            ? state?.approve
            : action === "reject"
              ? state?.reject
              : action === "cancel"
                ? state?.cancel
                : state?.edit;
        if (!allowed || state === null) {
          pendingApprovalDetailStatus.textContent =
            "计划状态已变化，未执行写操作。";
          return;
        }
        const body = {
          action,
          expected_plan_id: state.snapshot.planId,
          expected_revision: state.snapshot.revision,
        };
        if (action === "edit") {
          if (!Array.isArray(changes) || changes.length === 0) {
            pendingApprovalDetailStatus.textContent = "请填写至少一个新的目标目录。";
            return;
          }
          body.changes = changes;
        }
        pendingApprovalDetailStatus.textContent =
          action === "approve"
            ? "批准提交中…"
            : action === "reject"
              ? "拒绝提交中…"
              : action === "cancel"
                ? "取消提交中…"
                : "编辑提交中…";
        const response = await fetch(
          `/api/v1/workflows/${encodeURIComponent(state.snapshot.workflowId)}/decisions`,
          {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body),
          },
        );
        const payload = await response.json();
        if (!response.ok) {
          if (response.status === 409) {
            await loadPendingApprovalDetails(
              item,
              "计划状态已变化，已重新读取；未自动重试写操作。",
            );
            return;
          }
          pendingApprovalDetailStatus.textContent = safeErrorMessage(
            payload,
            "审批操作失败，请刷新计划后重试。",
          );
          return;
        }
        const updatedSnapshot = workflowSnapshot(payload);
        if (updatedSnapshot === null) {
          throw new Error("decision result unavailable");
        }
        if (action === "reject" || action === "cancel") {
          clearActiveWorkflow(updatedSnapshot.workflowId);
          resetPendingApprovalDetail();
          void loadPendingApprovals();
          return;
        }
        await loadPendingApprovalDetails(
          {
            ...item,
            plan_id: updatedSnapshot.planId,
            current_revision: updatedSnapshot.revision,
            approval_status: payload.approval_status,
          },
          action === "edit"
            ? "编辑完成，旧计划已失效并替换为新计划。"
            : "计划已批准，尚未执行文件操作。",
        );
        if (action === "approve") {
          void loadPendingApprovals(true);
        }
      } catch {
        pendingApprovalDetailStatus.textContent =
          "无法连接 FileNest API，请刷新计划后重试。";
      } finally {
        pendingApprovalBusy = false;
        configurePendingApprovalActions();
      }
    }

    async function submitPendingFileAction(action) {
      if (currentPendingApproval === null || pendingApprovalBusy) {
        return;
      }
      pendingApprovalBusy = true;
      configurePendingApprovalActions();
      const item = currentPendingApproval.item;
      try {
        if (!(await loadPendingApprovalDetails(item))) {
          return;
        }
        const state = pendingApprovalActionState();
        const allowed = action === "execute" ? state?.execute : state?.undo;
        if (!allowed || state === null) {
          pendingApprovalDetailStatus.textContent =
            "计划状态已变化，未执行文件操作。";
          return;
        }
        const query = new URLSearchParams({
          expected_plan_id: state.snapshot.planId,
          expected_revision: String(state.snapshot.revision),
        });
        pendingApprovalDetailStatus.textContent =
          action === "execute" ? "文件执行中…" : "撤销执行中…";
        const response = await fetch(
          `/api/v1/workflows/${encodeURIComponent(state.snapshot.workflowId)}/${action}?${query}`,
          {method: "POST"},
        );
        const payload = await response.json();
        if (!response.ok) {
          if (response.status === 409) {
            await loadPendingApprovalDetails(
              item,
              "计划状态已变化，已重新读取；未自动重试写操作。",
            );
            return;
          }
          pendingApprovalDetailStatus.textContent = safeErrorMessage(
            payload,
            action === "execute"
              ? "执行失败，请刷新计划后重试。"
              : "撤销失败，请刷新计划后重试。",
          );
          return;
        }
        const resultSnapshot = workflowSnapshot({
          workflow_id: payload.workflow_id,
          operation_plan: {plan_id: payload.plan_id},
          operation: {revision: state.snapshot.revision},
        });
        if (
          resultSnapshot === null ||
          resultSnapshot.workflowId !== state.snapshot.workflowId ||
          resultSnapshot.planId !== state.snapshot.planId ||
          !Array.isArray(payload.items)
        ) {
          throw new Error("file action result unavailable");
        }
        const refreshed = await loadPendingApprovalDetails(item);
        if (!refreshed || currentPendingApproval === null) {
          return;
        }
        renderAgentExecutionItems(
          payload,
          {
            executionList: pendingExecutionList,
            executionStatus: pendingExecutionStatus,
          },
          action === "execute" ? "执行" : "撤销",
        );
        pendingApprovalDetailStatus.textContent =
          action === "execute"
            ? "执行响应已返回，按钮状态已按最新服务端状态更新。"
            : "撤销响应已返回，按钮状态已按最新服务端状态更新。";
        if (action === "undo" && payload.status === "UNDONE") {
          clearActiveWorkflow(state.snapshot.workflowId);
        }
      } catch {
        pendingApprovalDetailStatus.textContent =
          "文件操作状态读取失败，未自动重试；请刷新后确认。";
      } finally {
        pendingApprovalBusy = false;
        configurePendingApprovalActions();
      }
    }

    function showSources(sources, workspaceName = "") {
      currentSources = Array.isArray(sources) ? sources : [];
      sourceList.replaceChildren();
      resultSources.hidden = true;
      if (currentSources.length === 0) {
        return;
      }

      for (const source of currentSources) {
        const item = document.createElement("li");
        const prefix = workspaceName ? `${workspaceName} / ` : "";
        item.textContent = `${prefix}${String(source.name)} — ${String(source.relative_path)}`;
        sourceList.append(item);
      }
      resultSources.hidden = false;
    }

    function clearAgentProposals() {
      proposalRenderToken += 1;
      agentProposalList.replaceChildren();
      agentProposalsPanel.hidden = true;
    }

    function workflowSnapshot(payload) {
      const workflowId = payload?.workflow_id;
      const planId = payload?.operation_plan?.plan_id;
      const revision = payload?.operation?.revision;
      if (
        typeof workflowId !== "string" ||
        typeof planId !== "string" ||
        !Number.isInteger(revision) ||
        revision < 0
      ) {
        return null;
      }
      return {
        workflowId,
        planId,
        revision,
      };
    }

    async function fetchWorkflowState(workflowId) {
      const workspaceId = workspaceSelect.value;
      if (!workspaceId || typeof workflowId !== "string") {
        throw new Error("workflow workspace unavailable");
      }

      const query = new URLSearchParams({workspace_id: workspaceId});
      const response = await fetch(
        `/api/v1/workflows/${encodeURIComponent(workflowId)}?${query}`,
      );
      const payload = await response.json();
      const snapshot = workflowSnapshot(payload);
      if (
        !response.ok ||
        snapshot === null ||
        snapshot.workflowId !== workflowId ||
        Number(payload.operation_plan.workspace_id) !== Number(workspaceId) ||
        String(payload.operation.workflow_id) !== workflowId ||
        String(payload.operation.plan_id) !== snapshot.planId
      ) {
        throw new Error("workflow state unavailable");
      }
      return payload;
    }

    async function fetchOperationPlanDetail(planId) {
      const workspaceId = workspaceSelect.value;
      if (!workspaceId || typeof planId !== "string") {
        throw new Error("operation plan workspace unavailable");
      }

      const query = new URLSearchParams({workspace_id: workspaceId});
      const response = await fetch(
        `/api/v1/operation-plans/${encodeURIComponent(planId)}?${query}`,
      );
      const payload = await response.json();
      if (
        !response.ok ||
        !payload ||
        typeof payload !== "object" ||
        String(payload.plan_id) !== planId ||
        Number(payload.workspace_id) !== Number(workspaceId) ||
        !Array.isArray(payload.operations) ||
        !Number.isInteger(payload.current_revision)
      ) {
        throw new Error("operation plan detail unavailable");
      }
      return payload;
    }

    function applyCurrentWorkflowState(payload) {
      const snapshot = workflowSnapshot(payload);
      if (snapshot === null) {
        throw new Error("current workflow snapshot unavailable");
      }
      currentWorkflow = snapshot;
      rememberActiveWorkflow(snapshot.workflowId, snapshot.planId);
      return snapshot;
    }

    function configureCurrentPlanActions(payload) {
      const snapshot = workflowSnapshot(payload);
      if (snapshot === null) {
        currentWorkflow = null;
        resetPlanActions();
        return;
      }
      currentWorkflow = snapshot;
      const operationStatus = String(payload.operation?.overall_status ?? "");
      if (
        payload.approval_status === "WAITING_APPROVAL" &&
        payload.status === "waiting" &&
        operationStatus === "WAITING_APPROVAL"
      ) {
        showApprovalActions();
      } else if (
        payload.approval_status === "APPROVED" &&
        payload.status === "ready" &&
        operationStatus === "APPROVED"
      ) {
        showExecutionAction();
      } else if (
        payload.approval_status === "APPROVED" &&
        payload.status === "ready" &&
        operationStatus === "COMPLETED"
      ) {
        showUndoAction();
      } else {
        resetPlanActions();
      }
    }

    async function refreshCurrentPlanState(message = "") {
      if (currentWorkflow === null) {
        return false;
      }
      const workflowId = currentWorkflow.workflowId;
      try {
        const payload = await fetchWorkflowState(workflowId);
        if (
          currentWorkflow === null ||
          currentWorkflow.workflowId !== workflowId ||
          workspaceSelect.value !== String(payload.operation_plan.workspace_id)
        ) {
          return false;
        }
        configureCurrentPlanActions(payload);
        if (message) {
          planStatus.textContent = message;
        }
        return true;
      } catch {
        if (currentWorkflow?.workflowId === workflowId) {
          currentWorkflow = null;
          resetPlanActions();
          planStatus.textContent =
            "最新计划状态读取失败，已停用文件操作按钮。";
        }
        return false;
      }
    }

    async function refreshCurrentPlanAfterConflict(message) {
      const refreshed = await refreshCurrentPlanState(message);
      if (!refreshed) {
        planStatus.textContent =
          "计划状态已变化且当前不可读取，未执行写操作；请刷新后确认。";
      }
    }

    async function fetchAgentProposalWorkflow(proposal) {
      if (
        typeof proposal.workflow_id !== "string" ||
        typeof proposal.plan_id !== "string"
      ) {
        throw new Error("proposal identifiers unavailable");
      }

      return fetchWorkflowState(proposal.workflow_id);
    }

    function hideAgentProposalActions(controls) {
      controls.stateLoaded = false;
      controls.actions.hidden = true;
      for (const button of controls.buttons) {
        button.hidden = true;
        button.disabled = true;
      }
    }

    function configureAgentProposalActions(payload, controls) {
      controls.lastWorkflow = payload;
      const stateLoaded = controls.stateLoaded === true;
      const snapshot = workflowSnapshot(payload);
      const approvalStatus = String(payload?.approval_status ?? "");
      const workflowStatus = String(payload?.status ?? "");
      const operationStatus = String(payload?.operation?.overall_status ?? "");
      const waitingForApproval =
        stateLoaded && snapshot !== null && approvalStatus === "WAITING_APPROVAL";
      const canExecute =
        stateLoaded &&
        snapshot !== null &&
        approvalStatus === "APPROVED" &&
        workflowStatus === "ready" &&
        operationStatus === "APPROVED";
      const canUndo =
        stateLoaded &&
        snapshot !== null &&
        approvalStatus === "APPROVED" &&
        workflowStatus === "ready" &&
        operationStatus === "COMPLETED";

      controls.approveButton.hidden = !waitingForApproval;
      controls.rejectButton.hidden = !waitingForApproval;
      controls.executeButton.hidden = !canExecute;
      controls.undoButton.hidden = !canUndo;
      controls.actions.hidden = !(waitingForApproval || canExecute || canUndo);
      for (const button of controls.buttons) {
        button.disabled = Boolean(controls.busy) || button.hidden;
      }
    }

    function syncAgentProposalWorkflow(proposal, payload, controls) {
      const snapshot = workflowSnapshot(payload);
      if (snapshot === null) {
        throw new Error("proposal snapshot unavailable");
      }
      proposal.plan_id = snapshot.planId;
      proposal.revision = snapshot.revision;
      proposal.approval_status = String(payload.approval_status);
      controls.meta.textContent =
        `workflow_id：${String(proposal.workflow_id)}；plan_id：${proposal.plan_id}`;
      const operationStatus = String(payload.operation?.overall_status ?? "");
      controls.statusElement.textContent =
        `审批状态：${proposal.approval_status}；工作流状态：${String(payload.status)}；操作状态：${operationStatus}`;
      controls.stateLoaded = true;
      configureAgentProposalActions(payload, controls);
    }

    function renderAgentExecutionItems(payload, controls, actionLabel) {
      if (!Array.isArray(payload?.items)) {
        throw new Error("execution items unavailable");
      }

      controls.executionList.replaceChildren();
      for (const executionItem of payload.items) {
        const item = document.createElement("li");
        const beforePath = String(executionItem.before_relative_path ?? "");
        const afterPath = String(executionItem.after_relative_path ?? "");
        const errorCode = executionItem.error_code;
        const errorSuffix =
          typeof errorCode === "string" && errorCode
            ? `；错误：${errorCode}`
            : "";
        item.textContent =
          `${actionLabel}项 ${String(executionItem.sequence_no)}：${String(executionItem.status)}；${beforePath} → ${afterPath}${errorSuffix}`;
        controls.executionList.append(item);
      }
      controls.executionList.hidden = false;
      controls.executionStatus.hidden = false;
      controls.executionStatus.textContent =
        `${actionLabel}结果：${String(payload.status)}；共 ${payload.items.length} 项。`;
    }

    async function loadAgentProposalDetails(
      proposal,
      statusElement,
      operationsList,
      controls,
      renderToken,
    ) {
      try {
        const payload = await fetchAgentProposalWorkflow(proposal);
        const operations = payload?.operation_plan?.operations;
        if (
          !Array.isArray(operations) ||
          renderToken !== proposalRenderToken
        ) {
          throw new Error("proposal details unavailable");
        }

        proposal.plan_id = String(payload.operation_plan.plan_id);
        proposal.approval_status = String(payload.approval_status);
        controls.meta.textContent =
          `workflow_id：${String(proposal.workflow_id)}；plan_id：${proposal.plan_id}`;
        if (!controls.busy) {
          syncAgentProposalWorkflow(proposal, payload, controls);
        }
        operationsList.replaceChildren();
        for (const operation of operations) {
          const item = document.createElement("li");
          item.textContent =
            `${String(operation.source_relative_path)} → ${String(operation.target_relative_path)}`;
          operationsList.append(item);
        }
      } catch {
        if (renderToken === proposalRenderToken) {
          statusElement.textContent = "操作明细暂不可用，请刷新后重试。";
        }
      }
    }

    async function refreshAgentProposalAfterConflict(
      proposal,
      controls,
      message,
    ) {
      try {
        const workflow = await fetchAgentProposalWorkflow(proposal);
        syncAgentProposalWorkflow(proposal, workflow, controls);
        controls.statusElement.textContent = message;
      } catch {
        hideAgentProposalActions(controls);
        controls.lastWorkflow = null;
        controls.statusElement.textContent =
          "计划状态已变化且当前不可读取，未执行写操作；请刷新后确认。";
      }
    }

    async function decideAgentProposal(
      proposal,
      action,
      controls,
    ) {
      controls.busy = true;
      for (const button of controls.buttons) {
        button.disabled = true;
      }
      controls.statusElement.textContent = action === "approve"
        ? "正在提交批准…"
        : "正在提交拒绝…";
      try {
        const workflow = await fetchAgentProposalWorkflow(proposal);
        syncAgentProposalWorkflow(proposal, workflow, controls);
        const snapshot = workflowSnapshot(workflow);
        if (snapshot === null) {
          throw new Error("approval snapshot unavailable");
        }
        const latestPlanId = snapshot.planId;
        const latestRevision = snapshot.revision;
        if (workflow.approval_status !== "WAITING_APPROVAL") {
          controls.statusElement.textContent =
            `审批状态：${String(workflow.approval_status)}；请刷新提案。`;
          return;
        }

        const response = await fetch(
          `/api/v1/workflows/${encodeURIComponent(proposal.workflow_id)}/decisions`,
          {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              action,
              expected_plan_id: latestPlanId,
              expected_revision: latestRevision,
            }),
          },
        );
        const payload = await response.json();
        if (!response.ok) {
          if (response.status === 409) {
            await refreshAgentProposalAfterConflict(
              proposal,
              controls,
              "计划状态已变化，已重新读取；未自动重试。",
            );
            return;
          }
          controls.statusElement.textContent = safeErrorMessage(
            payload,
            "审批提交失败，请刷新提案后重试。",
          );
          return;
        }

        if (
          !payload ||
          typeof payload !== "object" ||
          typeof payload.operation_plan?.plan_id !== "string"
        ) {
          throw new Error("approval result unavailable");
        }
