name: FileNest CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime and CI test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run focused unit tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_matcher.py \
            tests/test_model_client.py \
            tests/test_model_settings.py \
            tests/test_operation_plan_contracts.py \
            tests/test_operation_preview_contracts.py \
            tests/test_tool_contracts.py \
            tests/test_workflow.py \
            tests/test_document_contracts.py \
            tests/test_document_chunker.py

      - name: Run API and persistence integration tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_backend_migrations.py \
            tests/test_backend_workspaces.py \
            tests/test_workspace_scan_api.py \
            tests/test_file_query_api.py \
            tests/test_agent_api.py \
            tests/test_agent_loop_end_to_end.py \
            tests/test_workflow_runtime.py \
            tests/test_document_persistence.py \
            tests/test_document_sync.py \
            tests/test_file_search_end_to_end.py

      - name: Run security boundary tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_path_policy.py \
            tests/test_filesystem_adapter.py \
            tests/test_operation_preview_disk_immutability.py \
            tests/test_prompt_injection_security.py \
            tests/test_safe_file_mover.py \
            tests/test_quarantine.py \
            tests/test_safe_execution.py \
            tests/test_safe_execution_history.py

      - name: Run deterministic evaluation suites
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_agent_evaluation.py \
            tests/test_agent_evaluation_cli.py \
            tests/test_prompt_injection_evaluation.py \
            tests/test_safe_organization_evaluation_cli.py \
            tests/test_retrieval_metrics.py
